name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: emu-lab
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/android-kit
          ssh-key: ${{ secrets.DEPLOY_KEY_ANDROID_KIT }}
          path: android-kit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --include-workspace-root --workspace=@budaknyenyel/kit-schema && npm run build --workspace=@budaknyenyel/kit-schema
        working-directory: android-kit
      - run: npm ci && npm run build
        working-directory: emu-lab
      - run: |
          dir=$(node scripts/prepare-publish.mjs)
          cd "$dir"
          npm publish --provenance --access public
        working-directory: emu-lab
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
